<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Cars – CarCompass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a class="brand" href="/">&#9650; CarCompass</a>
      <div class="nav-links">
        <a href="/questionnaire.html">Get Recommendations</a>
        <span id="authLinks">
          <a href="/login.html" class="btn-ghost">Login</a>
          <a href="/signup.html" class="btn-primary-sm">Sign Up</a>
        </span>
        <span id="userArea" style="display:none">
          <span class="username-badge" id="userBadge"></span>
          <a href="#" class="btn-ghost" id="logoutBtn">Logout</a>
        </span>
      </div>
    </div>
  </nav>

  <div class="browse-page">
    <div class="browse-header">
      <h1 class="section-title">Browse Cars</h1>
      <p class="section-sub">Explore our full catalog – search, filter and sort to find your match.</p>

      <div class="search-row">
        <input class="search-input" id="searchInput" type="text" placeholder="🔍  Search by make, model or tag…" />
        <select class="filter-select" id="sortSelect">
          <option value="">Sort by…</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="mileage-desc">Best Mileage</option>
          <option value="safety-desc">Best Safety Rating</option>
        </select>
      </div>
    </div>

    <div class="cars-grid" id="carsGrid">
      <div class="car-skeleton"></div>
      <div class="car-skeleton"></div>
      <div class="car-skeleton"></div>
      <div class="car-skeleton"></div>
      <div class="car-skeleton"></div>
      <div class="car-skeleton"></div>
    </div>

    <p id="noResults" style="display:none;color:var(--text-muted);text-align:center;margin-top:40px">No cars match your search. Try different keywords.</p>
  </div>

  <footer class="footer">
    <div class="container">
      <span>&#9650; CarCompass &copy; 2026</span>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    let allCars = [];

    function formatPrice(price) {
      return price ? '$' + Number(price).toLocaleString() : 'N/A';
    }

    function starRating(r) {
      const s = Math.round(r || 0);
      return '★'.repeat(s) + '☆'.repeat(5 - s);
    }

    function renderCar(car) {
      const tags = (car.tags || []).slice(0, 3).map(t => `<span class="car-tag">${t}</span>`).join('');
      const firstImageId = (car.imageGridFsIds && car.imageGridFsIds.length > 0) ? car.imageGridFsIds[0] : null;
      const imgHtml = firstImageId
        ? `<img src="/api/cars/images/${firstImageId}" alt="${car.make} ${car.model}"
                style="width:100%;height:100%;object-fit:cover;"
                onerror="this.parentElement.innerHTML='<span style=\\'font-size:3.5rem\\'>🚗</span>'" />`
        : `<span style="font-size:3.5rem">🚗</span>`;

      return `
        <div class="car-card" onclick="window.location='/car.html?id=${car.id}'">
          <div class="car-card-img" style="overflow:hidden;display:flex;align-items:center;justify-content:center;">${imgHtml}</div>
          <div class="car-card-body">
            <div class="car-card-title">${car.make} ${car.model}</div>
            <div class="car-card-variant">${car.variant || ''}</div>
            <div class="car-card-meta">
              <span class="car-price">${formatPrice(car.exShowroomPrice)}</span>
              <span class="car-rating">${starRating(car.avgRating)} <span style="color:var(--text-muted)">(${car.reviewCount || 0})</span></span>
            </div>
            <div class="car-tags">${tags}</div>
          </div>
        </div>`;
    }

    function applyFilters() {
      const query = $('#searchInput').val().toLowerCase().trim();
      const sort = $('#sortSelect').val();

      let filtered = allCars.filter(car => {
        if (!query) return true;
        const haystack = [car.make, car.model, car.variant, ...(car.tags || [])].join(' ').toLowerCase();
        return haystack.includes(query);
      });

      if (sort === 'price-asc') filtered.sort((a, b) => (a.exShowroomPrice || 0) - (b.exShowroomPrice || 0));
      else if (sort === 'price-desc') filtered.sort((a, b) => (b.exShowroomPrice || 0) - (a.exShowroomPrice || 0));
      else if (sort === 'mileage-desc') filtered.sort((a, b) => (b.mileage || 0) - (a.mileage || 0));
      else if (sort === 'safety-desc') filtered.sort((a, b) => (b.safetyRating || 0) - (a.safetyRating || 0));

      const $grid = $('#carsGrid').empty();
      const $no = $('#noResults');
      if (filtered.length === 0) {
        $no.show();
      } else {
        $no.hide();
        filtered.forEach(car => $grid.append(renderCar(car)));
      }
    }

    $(function () {
      $.get('/api/cars', function (cars) {
        allCars = cars || [];
        applyFilters();
      }).fail(function () {
        $('#carsGrid').html('<p style="color:var(--text-muted);grid-column:1/-1">Failed to load cars.</p>');
      });

      let debounce;
      $('#searchInput').on('input', function () {
        clearTimeout(debounce);
        debounce = setTimeout(applyFilters, 300);
      });
      $('#sortSelect').on('change', applyFilters);
    });
  </script>
</body>
</html>
