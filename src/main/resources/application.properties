spring.application.name=carcompass

# 1. Let Spring Boot use the exact raw URI from Railway directly
# (Local fallback remains standard localhost)vw
spring.mongodb.uri=${MONGO_URL:mongodb://localhost:27017/carcompass}
spring.data.mongodb.uri=${MONGO_URL:mongodb://localhost:27017/carcompass}

# 2. Force the framework to target the business database cleanly
spring.mongodb.database=carcompass
spring.data.mongodb.database=carcompass
mongock.database-name=carcompass

# 3. Component scan and indexing settings
spring.mongodb.auto-index-creation=true
mongock.migration-scan-package=com.practice.carcompass.dbmigrations
